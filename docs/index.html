#boot.gone { opacity: 0; pointer-events: none; }
#boot .logo {
	flex: none;
	width: min(40vw, 170px, 21vh);
	margin: 0;
	filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.45)) drop-shadow(0 0 24px rgba(255, 170, 40, 0.45));
	animation: bob 2.6s ease-in-out infinite;
}
#boot .logo img { display: block; width: 100%; height: auto; }
#boot .title {
	margin: 6px 0 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-weight: 400;
	font-size: clamp(30px, 9vw, 44px);
	line-height: 1;
	letter-spacing: 0.04em;
	color: #ffd257;
	paint-order: stroke fill;
	-webkit-text-stroke: 6px #1a0e05;
	filter: drop-shadow(0 4px 0 #1a0e05);
}
#boot .title span { color: #fff4d6; }
#boot .hero {
	position: relative;
	flex: 1 1 auto;
	min-height: 0;
	width: min(84vw, 380px);
	display: flex;
	align-items: flex-end;
	justify-content: center;
	padding-bottom: 6px;
}
#boot .hero::before {
	content: "";
	position: absolute;
	left: 8%;
	right: 8%;
	bottom: 2%;
	height: 16%;
	border-radius: 50%;
	background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55), transparent 70%);
}
#boot .hero img {
	position: relative;
	max-width: 100%;
	max-height: 100%;
	object-fit: contain;
	filter: drop-shadow(0 0 22px rgba(255, 170, 40, 0.28));
	animation: bob 2.2s ease-in-out infinite;
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.bar {
	position: relative;
	flex: none;
	width: min(88vw, 400px);
	height: 34px;
	margin-top: 8px;
	border-radius: 17px;
	background: #1a0e05;
	border: 3px solid #e0a63a;
	box-shadow: 0 0 0 2px #1a0e05, 0 5px 0 2px #1a0e05, inset 0 3px 8px rgba(0, 0, 0, 0.8);
	overflow: hidden;
}
.bar i {
	position: relative;
	display: block;
	height: 100%;
	width: 0%;
	border-radius: 0 14px 14px 0;
	background:
		radial-gradient(circle at 20% 70%, rgba(255, 255, 255, 0.5) 0 2px, transparent 3px) 0 0 / 34px 34px,
		radial-gradient(circle at 65% 35%, rgba(255, 255, 255, 0.4) 0 2px, transparent 3px) 0 0 / 46px 46px,
		linear-gradient(180deg, #ffd45a, #ff9d1c 55%, #d96e08);
	animation: fizz 1.6s linear infinite;
}
.bar i::after {
	content: "";
	position: absolute;
	right: -2px;
	top: -3px;
	bottom: -3px;
	width: 16px;
	border-radius: 10px;
	background:
		radial-gradient(circle at 40% 25%, #fff 0 5px, transparent 6px),
		radial-gradient(circle at 55% 72%, #fff 0 5px, transparent 6px),
		#fff1c9;
}
@keyframes fizz { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 -34px, 0 -46px, 0 0; } }
#pct {
	flex: none;
	margin: 10px 0 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-size: 22px;
	color: #fff1c9;
	text-shadow: 0 2px 0 #1a0e05;
	font-variant-numeric: tabular-nums;
}
#boot .foot {
	flex: none;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 4px;
	margin-top: 12px;
}
#boot .made { margin: 0; font-size: 11px; letter-spacing: 2px; color: #c9b48a; }
#boot .studio {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	margin: 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-size: 16px;
	letter-spacing: 2px;
	white-space: nowrap;
	color: #ffd257;
}
#boot .ver { margin: 4px 0 0; font-size: 10px; letter-spacing: 1px; color: #c9b48a; opacity: 0.8; }
#tip {
	flex: none;
	margin: 12px 0 0;
	width: min(88vw, 400px);
	box-sizing: border-box;
	padding: 10px 14px 10px 10px;
	border-radius: 14px;
	border: 2px solid rgba(255, 190, 70, 0.45);
	background: rgba(18, 11, 6, 0.82);
	font-size: 14px;
	line-height: 1.35;
	text-align: left;
	color: #f3e6c8;
	min-height: 3.4em;
	display: flex;
	align-items: center;
	gap: 12px;
}
#tip::before {
	content: "";
	flex: none;

#status {
	margin: 6px 0 0;
	min-height: 1.4em;
	font-size: 13px;
	color: #d9c39a;
	font-variant-numeric: tabular-nums;
}
#error {
	max-width: 420px;
	margin: 0;
	padding: 14px 16px;
	border-radius: 10px;
	background: rgba(255, 92, 122, 0.12);
	box-shadow: inset 0 0 0 1px rgba(255, 92, 122, 0.55);
	color: var(--text);
	font-size: 14px;
	line-height: 1.45;
	white-space: pre-line;
	text-align: left;
}
#retry {
	font: inherit;
	font-size: 15px;
	padding: 10px 22px;
	border: 0;
	border-radius: 999px;
	background: var(--pink);
	color: #fff;
	cursor: pointer;
}
#crash {
	position: fixed;
	inset: 0;
	z-index: 9;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 24px 16px;
	background: rgba(13, 10, 28, 0.94);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	text-align: center;
}
#crash.show { display: flex; }
#crash h2 { margin: 0; font-size: 26px; color: var(--pink); }
#crash pre {
	max-width: 92vw;
	max-height: 34vh;
	overflow: auto;
	margin: 0;
	padding: 10px 12px;
	border-radius: 10px;
	background: rgba(255, 255, 255, 0.06);
	color: var(--muted);
	font-size: 11px;
	text-align: left;
	white-space: pre-wrap;
	word-break: break-word;
}
#crash button {
	font: inherit;
	font-size: 15px;
	padding: 10px 22px;
	border: 0;
	border-radius: 999px;
	color: #fff;
	background: var(--pink);
	cursor: pointer;
}
#crash button.alt { background: #2d5160; }
#retry:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
#rotate {
	position: fixed;
	inset: 0;
	z-index: 8;
	pointer-events: none;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 26px;
	padding: 24px;
	text-align: center;
	background:
		radial-gradient(90% 50% at 50% 40%, rgba(0, 245, 255, 0.16), transparent 65%),
		radial-gradient(120% 60% at 50% 110%, rgba(255, 46, 166, 0.28), transparent 60%),
		rgba(13, 10, 28, 0.97);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#rotate .phone {
	position: relative;
	width: 74px;
	height: 128px;
	border-radius: 16px;
	border: 4px solid var(--cyan);
	box-shadow: 0 0 22px rgba(0, 245, 255, 0.55), inset 0 0 14px rgba(0, 245, 255, 0.25);
	background: rgba(0, 245, 255, 0.06);
	animation: turn 1.8s ease-in-out infinite;
}
#rotate .phone::before {
	content: "";
	position: absolute;
	top: 8px;
	left: 50%;
	width: 22px;
	height: 5px;
	margin-left: -11px;
	border-radius: 3px;
	background: var(--cyan);
	opacity: 0.8;
}
#rotate .phone::after {
	content: "";
	position: absolute;
	left: 50%;
	bottom: 14px;
	width: 26px;
	height: 26px;
	margin-left: -13px;
	border-radius: 50%;
	background: radial-gradient(circle, var(--pink) 30%, transparent 70%);
	animation: pulse 1.3s ease-in-out infinite;
}
@keyframes turn {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-10px); }
}
@keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
#rotate h2 {
	margin: 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-weight: 400;
	font-size: clamp(26px, 8vw, 40px);
	color: #fff;
	text-shadow: 0 0 6px var(--pink), 0 0 22px rgba(255, 46, 166, 0.7);
}
#rotate p { margin: 0; max-width: 300px; font-size: 15px; line-height: 1.4; color: var(--muted); }
#rotate p b { color: var(--cyan); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
	#rotate .phone, #rotate .phone::after { animation: none; }
	#boot, .bar i { transition: none; }
}

				'Игра грузится из интернета, а интернета у тебя сейчас нет. Логика железная.',
				'Скорее всего, роутер обиделся. Постучи по нему и попробуй ещё раз.',
				'Свалка на связи, а ты где-то в цифровой пустоте. Включи интернет и возвращайся.',
				'Мы честно пытались достучаться до сервера. Сервер сделал вид, что не слышит.',
				'Без сети енот не воюет. Найди сигнал, хоть на крыше, хоть у соседа.'
			],
			buttons: ['Дёрнуть рубильник', 'Ещё разок, с чувством', 'Попробовать снова', 'Реанимировать']
		},
		engine: {
			titles: ['Движок завис', 'Енот уснул на старте', 'Что-то пошло по помойке'],
			lines: [
				'Закрой лишние вкладки, пусть телефон выдохнет, и попробуй ещё раз.',
				'Телефон не потянул. Бывает, свалка тяжёлая. Освободи память и перезапусти.',
				'Движок задумался о смысле жизни. Подождать не вариант, перезапусти.'
			],
			buttons: ['Пнуть движок', 'Перезапустить', 'Ещё разок']
		},
		wasm: {
			titles: ['Браузер упёрся', 'Не тот браузер'],
			lines: [
				'Этот браузер не умеет запускать игру. Открой ссылку в Safari или Chrome.',
				'Встроенный просмотрщик режет всё, что интереснее текста. Открой в обычном браузере.'
			],
			buttons: ['Попробовать ещё раз', 'Ещё разок']
		}
	};

	function pick(list) {
		return list[Math.floor(Math.random() * list.length)];
	}

	function fail(message, canRetry, kind) {
		if (failed) {
			return;
		}
		failed = true;
		const set = QUIPS[kind || 'net'];
		statusEl.hidden = true;
		tipEl.hidden = true;
		errorEl.textContent = '';
		const head = document.createElement('strong');
		head.textContent = pick(set.titles);
		head.style.display = 'block';
		head.style.marginBottom = '6px';
		head.style.fontSize = '17px';
		head.style.color = 'var(--pink)';
		const body = document.createElement('span');
		body.textContent = pick(set.lines);
		errorEl.appendChild(head);
		errorEl.appendChild(body);
		if (message) {
			const tech = document.createElement('small');
			tech.textContent = message;
			tech.style.display = 'block';
			tech.style.marginTop = '8px';
			tech.style.opacity = '0.55';
			tech.style.fontSize = '11px';
			errorEl.appendChild(tech);
		}
		errorEl.hidden = false;
		retryBtn.textContent = pick(set.buttons);
		retryBtn.hidden = !canRetry;
	}

	retryBtn.addEventListener('click', function () {
		window.location.reload();
	});

	function checkSupport() {
		try {
			new WebAssembly.Module(Uint8Array.of(0, 97, 115, 109, 1, 0, 0, 0));
		} catch (e) {
			return 'Этот просмотрщик запрещает WebAssembly, а без него игра не запускается.\n' +
				'Откройте ссылку в Safari или Chrome (кнопка «Открыть в браузере»).';
		}
		const probe = document.createElement('canvas');
		if (!probe.getContext('webgl2')) {
			return 'Браузер не поддерживает WebGL 2.\nОбновите iOS / браузер до свежей версии.';
		}
		return '';
	}

	// Файл игры режется на части (лимит хостинга — 15 МБ на файл): части качаются параллельно,
	// каждая распаковывается отдельно, затем склеиваются в исходный файл по порядку.
	function updatePart(key, index, value) {
		loadedParts[key][index] = value;
		loaded[key] = loadedParts[key].reduce(function (acc, n) { return acc + n; }, 0);
		renderProgress();
	}

	function downloadPart(key, index) {
		const part = FILES[key].parts[index];
		return fetch(part.url, { cache: 'force-cache' }).then(function (response) {
			// Размер не совпал с ожидаемым: в кэше чужая версия части. Качаем заново мимо кэша.
			const size = Number(response.headers.get('content-length') || 0);
			if (response.ok && size > 0 && !response.headers.get('content-encoding') && size !== part.bytes && !part.retried) {
				part.retried = true;
				return fetch(part.url, { cache: 'reload' });
			}
			return response;
		}).then(function (response) {
			if (!response.ok) {
				throw new Error('HTTP ' + response.status + ' на ' + part.url);
			}
			if (!response.body || !response.body.getReader) {
				return response.arrayBuffer().then(function (buffer) {
					updatePart(key, index, part.bytes);
					return new Uint8Array(buffer);
				});
			}
			const reader = response.body.getReader();
			const chunks = [];
			let size = 0;
			function pump() {
				return reader.read().then(function (step) {
					if (step.done) {
						const out = new Uint8Array(size);
						let offset = 0;
						for (const chunk of chunks) {
							out.set(chunk, offset);
							offset += chunk.length;
						}
						updatePart(key, index, part.bytes);
						return out;
					}
					chunks.push(step.value);
					size += step.value.length;
					updatePart(key, index, Math.min(size, part.bytes));
					return pump();
				});
			}
			return pump();
		}).then(gunzipIfNeeded);
	}

	function download(key) {
		return Promise.all(FILES[key].parts.map(function (part, index) {
			return downloadPart(key, index);
		})).then(function (pieces) {
			if (pieces.length === 1) {
				return pieces[0];
			}
			let length = 0;
			for (const piece of pieces) {
				length += piece.length;
			}
			const out = new Uint8Array(length);
			let offset = 0;
			for (const piece of pieces) {
				out.set(piece, offset);
				offset += piece.length;
			}
			pieces.length = 0;
			return out;
		});
	}

	// Хост может сам отдать .gz с Content-Encoding: gzip — тогда байты уже распакованы.
	function gunzipIfNeeded(bytes) {
		if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) {
			return Promise.resolve(bytes);
		}
		if (typeof DecompressionStream === 'function') {
			const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
			return new Response(stream).arrayBuffer().then(function (buffer) {
				return new Uint8Array(buffer);
			});
		}
		if (window.pako) {
			return Promise.resolve(window.pako.inflate(bytes));
		}
		return Promise.reject(new Error('Браузер не умеет распаковывать gzip.'));
	}

	// Мост держит распакованные байты (~50 МБ) только до старта движка: после этого Godot уже
	// скопировал их к себе, и release() отпускает копии — на телефоне это заметная экономия памяти.
	function installFetchBridge(wasmBytes, pckBytes) {
		const nativeFetch = window.fetch.bind(window);
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : (input && input.url) || '';
			const path = url.split('?')[0].split('#')[0];
			if (/(^|\/)index\.wasm$/.test(path)) {
				return Promise.resolve(new Response(wasmBytes, { status: 200, headers: { 'Content-Type': 'application/wasm' } }));
			}
			if (/(^|\/)index\.pck$/.test(path)) {
				return Promise.resolve(new Response(pckBytes, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } }));
			}
			return nativeFetch(input, init);
		};
		return function release() {
			wasmBytes = null;
			pckBytes = null;
			window.fetch = nativeFetch;
		};
	}

	function start() {
		const problem = checkSupport();
		if (problem) {
			fail(problem, false, 'wasm');
			return;
		}
		renderProgress();
		Promise.all([download('wasm'), download('pck')]).then(function (parts) {
			statusEl.textContent = 'Запускаем движок…';
			target = 100;
			fill.style.width = '100%';
			pctEl.textContent = '100%';
			const release = installFetchBridge(parts[0], parts[1]);
			parts.length = 0;
			const engine = new Engine(GODOT_CONFIG);
			const watchdog = setTimeout(function () {
				fail('Движок не запустился за 40 секунд.', true, 'engine');
			}, 40000);
			return engine.startGame({}).then(function () {
				clearTimeout(watchdog);
				started = true;
				if (window.trkLoaded) { window.trkLoaded(); }
				release();
				if (failed) {
					return;
				}
				boot.classList.add('gone');
				setTimeout(function () {
					boot.remove();
				}, 400);
			});
		}).catch(function (err) {
			console.error(err);
			const text = err && err.message ? err.message : String(err);
			fail(text, true, navigator.onLine === false || /fetch|network|load|HTTP|timeout/i.test(text) ? 'net' : 'engine');
		});
	}

	window.addEventListener('unhandledrejection', function (event) {
		const reason = event.reason;
		const text = reason && reason.message ? reason.message : String(reason);
		if (/WebAssembly|wasm/i.test(text)) {
			fail(text, true, 'wasm');
		}
	});

	const CRASH_PATTERN = /Aborted|abort\(|out of memory|memory access out of bounds|unreachable|RuntimeError|Cannot enlarge/i;
	window.addEventListener('unhandledrejection', function (event) {
		const reason = event.reason;
		const text = reason && reason.message ? reason.message : String(reason);
		if (CRASH_PATTERN.test(text)) {
			crash(text);
		}
	});
	window.addEventListener('error', function (event) {
		const text = event.message || (event.error && event.error.message) || '';
		if (CRASH_PATTERN.test(text)) {
			crash(text);
		}
	});

	start();
}());
</script>
