<style>
html.sideways #rotate { display: flex; }
:root {
	color-scheme: dark;
	--night: #0b171c;
	--panel: #142a33;
	--pink: #00d5ec;
	--cyan: #00f5ff;
	--text: #efe9ff;
	--muted: #9cbbc9;
	--danger: #ff5c7a;
	padding: 0 !important;
}
html, body {
	height: 100%;
	margin: 0;
	background: var(--night);
	color: var(--text);
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}
#canvas {
	position: fixed;
	left: 0;
	top: 0;
	display: block;
	outline: none;
	touch-action: none;
}
#boot {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: flex-start;
	gap: 0;
	padding: max(28px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
	background:
		radial-gradient(70% 45% at 50% 38%, rgba(0, 229, 255, 0.22), transparent 70%),
		radial-gradient(120% 50% at 50% 115%, rgba(255, 190, 60, 0.16), transparent 60%),
		repeating-linear-gradient(60deg, rgba(0, 229, 255, 0.045) 0 2px, transparent 2px 46px),
		repeating-linear-gradient(-60deg, rgba(0, 229, 255, 0.045) 0 2px, transparent 2px 46px),
		linear-gradient(180deg, #08131b, #0b1d29 55%, #07121a);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	text-align: center;
	z-index: 5;
	transition: opacity 0.35s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
#boot .logo {
	margin: 4vh 0 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-weight: 400;
	font-size: clamp(40px, 13vw, 72px);
	line-height: 0.95;
	letter-spacing: 0.01em;
	paint-order: stroke fill;
	-webkit-text-stroke: 7px #07121a;
	filter: drop-shadow(0 6px 0 #07121a) drop-shadow(0 0 22px rgba(0, 229, 255, 0.35));
	transform: rotate(-3deg);
}
#boot .logo b { display: block; font-weight: 400; color: #ffd257; }
#boot .logo i { display: block; font-style: normal; color: #00e5ff; margin-left: 0.9em; }
#boot .hero {
	position: relative;
	flex: 1 1 auto;
	min-height: 0;
	width: min(80vw, 340px);
	display: flex;
	align-items: center;
	justify-content: center;
}
#boot .hero::before {
	content: "";
	position: absolute;
	width: 82%;
	aspect-ratio: 1;
	border-radius: 50%;
	border: 3px solid rgba(0, 229, 255, 0.55);
	box-shadow: 0 0 34px rgba(0, 229, 255, 0.35), inset 0 0 38px rgba(0, 229, 255, 0.2);
	background: radial-gradient(circle, rgba(0, 229, 255, 0.16), transparent 68%);
}
#boot .hero img {
	position: relative;
	max-width: 88%;
	max-height: 94%;
	object-fit: contain;
	filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.35));
	animation: bob 2.2s ease-in-out infinite;
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.bar {
	position: relative;
	width: min(88vw, 400px);
	height: 30px;
	border-radius: 9px;
	background: #08131b;
	border: 3px solid #8a5a2e;
	box-shadow: 0 0 0 2px #2a1a0c, 0 4px 0 2px #2a1a0c, inset 0 3px 8px rgba(0, 0, 0, 0.7);
	overflow: hidden;
}
.bar i {
	display: block;
	height: 100%;
	width: 0%;
	background:
		repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.18) 0 10px, transparent 10px 20px),
		linear-gradient(180deg, #5af2ff, #00b7d6);
	box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
	background-size: 28px 28px, 100% 100%;
	animation: stripes 0.9s linear infinite;
}
@keyframes stripes { from { background-position: 0 0, 0 0; } to { background-position: 28px 0, 0 0; } }
.bar i::after { content: none; }
#pct {
	margin: 12px 0 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-size: 22px;
	color: #ffd257;
	text-shadow: 0 2px 0 #07121a;
	font-variant-numeric: tabular-nums;
}
#boot .foot {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 4px;
	margin-top: 14px;
}
#boot .made { margin: 0; font-size: 11px; letter-spacing: 2px; color: #6f98a8; }
#boot .studio {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	margin: 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-size: 16px;
	letter-spacing: 2px;
	white-space: nowrap;
	color: #5ff2ff;
}
#boot .ver {
	margin: 4px 0 0;
	font-size: 10px;
	letter-spacing: 1px;
	color: #6f98a8;
	opacity: 0.8;
}
#tip {
	margin: 14px 0 0;
	width: min(88vw, 400px);
	box-sizing: border-box;
	padding: 10px 14px;
	border-radius: 14px;
	border: 2px solid rgba(0, 229, 255, 0.35);
	background: rgba(8, 24, 34, 0.78);
	font-size: 14px;
	line-height: 1.35;
	text-align: left;
	color: #cfe9f2;
	min-height: 3.2em;
	display: flex;
	align-items: center;
	gap: 12px;
}
#tip::before {
	content: "СОВЕТ";
	flex: none;
	padding: 4px 8px;
	border-radius: 8px;
	background: #ffd257;
	color: #08131b;
	font: 800 11px system-ui, sans-serif;
	letter-spacing: 1px;
}
#status {
	margin: 6px 0 0;
	min-height: 1.4em;
	font-size: 13px;
	color: #7fa6b6;
	font-variant-numeric: tabular-nums;
}
#error {
	max-width: 420px;
	margin: 0;
	padding: 14px 16px;
	border-radius: 10px;
	background: rgba(255, 92, 122, 0.12);
	box-shadow: inset 0 0 0 1px rgba(255, 92, 122, 0.55);
	color: var(--text);
	font-size: 14px;
	line-height: 1.45;
	white-space: pre-line;
	text-align: left;
}
#retry {
	font: inherit;
	font-size: 15px;
	padding: 10px 22px;
	border: 0;
	border-radius: 999px;
	background: var(--pink);
	color: #fff;
	cursor: pointer;
}
#crash {
	position: fixed;
	inset: 0;
	z-index: 9;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 24px 16px;
	background: rgba(13, 10, 28, 0.94);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	text-align: center;
}
#crash.show { display: flex; }
#crash h2 { margin: 0; font-size: 26px; color: var(--pink); }
#crash pre {
	max-width: 92vw;
	max-height: 34vh;
	overflow: auto;
	margin: 0;
	padding: 10px 12px;
	border-radius: 10px;
	background: rgba(255, 255, 255, 0.06);
	color: var(--muted);
	font-size: 11px;
	text-align: left;
	white-space: pre-wrap;
	word-break: break-word;
}
#crash button {
	font: inherit;
	font-size: 15px;
	padding: 10px 22px;
	border: 0;
	border-radius: 999px;
	color: #fff;
	background: var(--pink);
	cursor: pointer;
}
#crash button.alt { background: #2d5160; }
#retry:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
#rotate {
	position: fixed;
	inset: 0;
	z-index: 8;
	pointer-events: none;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 26px;
	padding: 24px;
	text-align: center;
	background:
		radial-gradient(90% 50% at 50% 40%, rgba(0, 245, 255, 0.16), transparent 65%),
		radial-gradient(120% 60% at 50% 110%, rgba(255, 46, 166, 0.28), transparent 60%),
		rgba(13, 10, 28, 0.97);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#rotate .phone {
	position: relative;
	width: 74px;
	height: 128px;
	border-radius: 16px;
	border: 4px solid var(--cyan);
	box-shadow: 0 0 22px rgba(0, 245, 255, 0.55), inset 0 0 14px rgba(0, 245, 255, 0.25);
	background: rgba(0, 245, 255, 0.06);
	animation: turn 1.8s ease-in-out infinite;
}
#rotate .phone::before {
	content: "";
	position: absolute;
	top: 8px;
	left: 50%;
	width: 22px;
	height: 5px;
	margin-left: -11px;
	border-radius: 3px;
	background: var(--cyan);
	opacity: 0.8;
}
#rotate .phone::after {
	content: "";
	position: absolute;
	left: 50%;
	bottom: 14px;
	width: 26px;
	height: 26px;
	margin-left: -13px;
	border-radius: 50%;
	background: radial-gradient(circle, var(--pink) 30%, transparent 70%);
	animation: pulse 1.3s ease-in-out infinite;
}
@keyframes turn {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-10px); }
}
@keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
#rotate h2 {
	margin: 0;
	font-family: "Russo One", "Arial Black", Impact, sans-serif;
	font-weight: 400;
	font-size: clamp(26px, 8vw, 40px);
	color: #fff;
	text-shadow: 0 0 6px var(--pink), 0 0 22px rgba(255, 46, 166, 0.7);
}
#rotate p { margin: 0; max-width: 300px; font-size: 15px; line-height: 1.4; color: var(--muted); }
#rotate p b { color: var(--cyan); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
	#rotate .phone, #rotate .phone::after { animation: none; }
	#boot, .bar i { transition: none; }
}
</style>

(function () {

	function sync() {
		const hidden = document.visibilityState === 'hidden';
		all.forEach(function (ctx) {

		var sideways = phone && window.innerWidth > window.innerHeight * 1.05;
		document.documentElement.classList.toggle('sideways', sideways);
	};
	judge();
	setInterval(judge, 300);
	window.addEventListener('orientationchange', function () { judge(); setTimeout(judge, 400); });
	window.addEventListener('orientationchange', kick);
	window.addEventListener('resize', judge);
	window.addEventListener('resize', kick);
	if (window.visualViewport) { window.visualViewport.addEventListener('resize', kick); }

	// Экранная клавиатура на iOS не меняет размер страницы, а сдвигает «видимое окно» вниз. Пока печатают в поле игры,
	// держим холст в видимой части (сдвиг на offsetTop), игра сама сожмёт окно по высоте видимой области.
	// Браузерные поля ввода лежат поверх холста по координатам игры, поэтому после каждого сдвига их кладём заново.
	var vv = window.visualViewport;
	if (vv) {
		var relayout = function () {
			var cv = document.getElementById('canvas');
			if (!cv) { return; }
			var r = cv.getBoundingClientRect();
			document.querySelectorAll('input[id^=trk_in_]').forEach(function (el) {
				var d = el.dataset;
				if (!d.gx) { return; }
				var k = r.width / Number(d.vw);
				el.style.left = (r.left + Number(d.gx) * k) + 'px';
				el.style.top = (r.top + Number(d.gy) * k) + 'px';
				el.style.width = (Number(d.gw) * k) + 'px';
				el.style.height = (Number(d.gh) * k) + 'px';
			});
		};
		window.__trkRelayout = relayout;
		var typingUntil = 0;
		var follow = function () {
			var cv = document.getElementById('canvas');
			if (!cv) { return; }
			var typing = !!(document.activeElement && String(document.activeElement.id).indexOf('trk_in_') === 0);
			if (typing) { typingUntil = Date.now() + 700; }
			var want = (typing || Date.now() < typingUntil) && vv.offsetTop > 0 ? 'translateY(' + vv.offsetTop + 'px)' : '';
			if (cv.style.transform !== want) {
				cv.style.transform = want;
				relayout();
			}
		};
		var loop = function () {
			if (Date.now() < typingUntil || (document.activeElement && String(document.activeElement.id).indexOf('trk_in_') === 0)) { follow(); }
			requestAnimationFrame(loop);
		};
		requestAnimationFrame(loop);
		vv.addEventListener('resize', follow);
		vv.addEventListener('scroll', follow);
		document.addEventListener('focusin', function () { typingUntil = Date.now() + 700; follow(); });
		document.addEventListener('focusout', function () { typingUntil = Date.now() + 700; });
	}
})();
</script>

<script>
/* Адрес, с которым iOS кладёт игру на экран «Домой». Аккаунт с логином: мини-апка открывается с окном входа
   (?login=имя). Гость: скрытый вход (?g=guest_….пароль) — мини-апка входит в тот же аккаунт, ничего не переносится.
   Старый код восстановления (?restore=) — только если скрытого входа ещё нет (он ПЕРЕНОСИТ гостя). */
(function () {
	var baseManifest = document.querySelector('link[rel="manifest"]');
	var lastKey = '';
	function sync() {
		var code = '', login = '', guest = '';
		try {
			code = window.localStorage.getItem('trk_recovery_code') || '';
			login = window.localStorage.getItem('trk_cloud_email') || '';
			guest = window.localStorage.getItem('trk_guest_key') || '';
		} catch (e) { return; }
		var key = '', value = '';
		if (/^[a-z0-9_]{3,20}$/.test(login)) { key = 'login'; value = login; }
		else if (/^guest_[a-z0-9]{12}\.[A-Za-z0-9]{24}$/.test(guest)) { key = 'g'; value = guest; }
		else if (/^[A-Za-z0-9]{8,24}$/.test(code)) { key = 'restore'; value = code; }
		if (!key || key + value === lastKey) { return; }
		lastKey = key + value;
		var params = new URLSearchParams(location.search);
		params.delete('restore');
		params.delete('login');
		params.delete('g');
		params.set(key, value);
		try { history.replaceState(null, '', location.pathname + '?' + params.toString() + location.hash); } catch (e) {}
		if (baseManifest) {
			try {
				var m = {name: 'Trash Squad', short_name: 'Trash Squad', start_url: location.pathname + '?' + key + '=' + encodeURIComponent(value), scope: location.pathname,
					display: 'fullscreen', orientation: 'portrait', background_color: '#0b171c', theme_color: '#0b171c',
					icons: [{src: new URL('icon192.png', location.href).href, sizes: '192x192', type: 'image/png'}, {src: new URL('icon512.png', location.href).href, sizes: '512x512', type: 'image/png'}]};
				baseManifest.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type: 'application/manifest+json'}));
			} catch (e) {}
		}
	}
	setInterval(sync, 3000);
	setTimeout(sync, 1500);
})();
</script>

<script>
(function () {
	'use strict';

	// Хостинг ограничивает бинарный файл 15 МБ и отдаёт только «веб-типы», а index.wasm весит
	// ~44 МБ: движок лежит gzip-ом (raccoon.core.wasm), пак ресурсов — как raccoon.pack.wasm.
	// Загрузчик Godot (Preloader) берёт файлы через window.fetch: подменяем fetch для
	// index.wasm / index.pck и отдаём ему уже скачанные и распакованные байты.
	const FILES = {
		wasm: { parts: __WASM_PARTS__ },
		pck: { parts: __PCK_PARTS__ },
	};
	const GODOT_CONFIG = {
		args: [],
		canvasResizePolicy: 2,
		ensureCrossOriginIsolationHeaders: false,
		executable: 'index',
		experimentalVK: false,
		fileSizes: { 'index.pck': __PCK_SIZE__, 'index.wasm': __WASM_SIZE__ },
		focusCanvas: true,
		gdextensionLibs: [],
		onPrint: function () {
			keepLog('log', arguments);
			console.log.apply(console, arguments);
		},
		onPrintError: function () {
			keepLog('err', arguments);
			console.error.apply(console, arguments);
			const text = Array.prototype.join.call(arguments, ' ');
			if (text.indexOf('!is_inside_tree()') !== -1) {
				treeErrors += 1;
			}
			if (/ERROR|Error/.test(text) && window.trkReport && treeErrors <= 3) {
				window.trkReport('error', text);
			}
			if (/Aborted|abort\(|out of memory|Cannot enlarge memory|memory access out of bounds|unreachable/i.test(text)) {
				crash(text);
			}
		},
	};

	// Адрес сбора отчётов о вылетах (Google Apps Script / Supabase и т.п.); пусто — отчёты не отправляются.
	const REPORT_URL = 'https://script.google.com/macros/s/AKfycbxVyy-SnRANW0Im-1Blne2TcUbca93WqzyBulpADwWWD7YH6x3KIygBYImTe8VfP5pp/exec';
	const BUILD_ID_REPORT = '__BUILD_ID__';
	const SESSION_ID = Math.random().toString(36).slice(2, 8);
	const SESSION_START = Date.now();
	const REPORT_CAP = 250;
	const sentKeys = {};
	let reportCount = 0;
	const logTail = [];
	let treeErrors = 0;
	const eventLog = [];
	let hiddenMs = 0;
	let hiddenSince = 0;
	let battery = null;
	let userId = '';
	try {
		userId = window.localStorage.getItem('trk_uid') || '';
		if (!userId) {
			userId = Math.random().toString(36).slice(2, 10);
			window.localStorage.setItem('trk_uid', userId);
		}
	} catch (e) { userId = 'nostorage'; }

	function noteEvent(text) {
		eventLog.push(Math.round((Date.now() - SESSION_START) / 1000) + 's ' + text);
		if (eventLog.length > 25) { eventLog.shift(); }
	}
	window.trkNote = noteEvent;

	function gpuInfo() {
		try {
			const c = document.createElement('canvas');
			const gl = c.getContext('webgl2') || c.getContext('webgl');
			if (!gl) { return 'no webgl'; }
			const ext = gl.getExtension('WEBGL_debug_renderer_info');
			const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
			return name + ' | maxTex ' + gl.getParameter(gl.MAX_TEXTURE_SIZE);
		} catch (e) { return 'gpu?'; }
	}

	function envInfo() {
		const nav = navigator;
		const conn = nav.connection || {};
		let heap = '';
		try { if (performance.memory) { heap = Math.round(performance.memory.usedJSHeapSize / 1048576) + '/' + Math.round(performance.memory.jsHeapSizeLimit / 1048576) + 'MB'; } } catch (e) {}
		let standalone = false;
		try { standalone = !!(window.matchMedia('(display-mode: standalone)').matches || nav.standalone); } catch (e) {}
		return {
			uid: userId,
			ua: nav.userAgent,
			model: highEntropy,
			geo: geo,
			lang: nav.language,
			tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })(),
			screen: screen.width + 'x' + screen.height,
			inner: window.innerWidth + 'x' + window.innerHeight,
			dpr: window.__trash_real_dpr ? window.__trash_real_dpr() : window.devicePixelRatio,
			dprCap: window.__trash_dpr_cap,
			mem: nav.deviceMemory || '?',
			cores: nav.hardwareConcurrency || '?',
			net: (conn.effectiveType || '?') + ' ' + (conn.downlink || '?') + 'Mbps rtt' + (conn.rtt || '?') + (conn.saveData ? ' saveData' : ''),
			battery: battery ? Math.round(battery.level * 100) + '%' + (battery.charging ? ' charging' : '') : '?',
			heap: heap,
			visible: document.visibilityState,
			standalone: standalone,
			online: nav.onLine,
			hiddenSec: Math.round((hiddenMs + (hiddenSince ? Date.now() - hiddenSince : 0)) / 1000),
			url: location.href.slice(0, 120),
			ref: (document.referrer || '').slice(0, 80)
		};
	}

	let highEntropy = '';
	let geo = '';
	try {
		if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
			navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion', 'fullVersionList']).then(function (v) {
				highEntropy = (v.model || '') + ' / Android ' + (v.platformVersion || '?');
			});
		}
	} catch (e) {}
	const loadStart = Date.now();
	window.trkLoaded = function () {
		const took = Date.now() - loadStart;
		noteEvent('engine started after ' + took + ' ms');
		try {
			const parts = performance.getEntriesByType('resource').filter(function (e) { return /\.(wasm|pck|js)(\?|$)/.test(e.name); }).map(function (e) {
				return e.name.split('/').pop().split('?')[0] + ' ' + Math.round((e.encodedBodySize || e.transferSize || 0) / 1024) + 'KB ' + Math.round(e.duration) + 'ms';
			});
			window.trkReport('load', 'engine ready in ' + took + ' ms | ' + parts.join(' ; '));
		} catch (e) {}
	};
	try {
		fetch('https://ipwho.is/').then(function (r) { return r.json(); }).then(function (g) {
			if (g && g.success) {
				geo = (g.city || '?') + ', ' + (g.region || '') + ', ' + (g.country || '') + ' | ' + ((g.connection && g.connection.isp) || '');
				window.trkReport('geo', geo);
			}
		}).catch(function () {});
	} catch (e) {}
	try {
		const shot = window.localStorage.getItem('__trash_shot');
		if (shot) {
			window.localStorage.removeItem('__trash_shot');
			window.setTimeout(function () {
				window.trkReport('prev_session_died', 'previous session ended in battle without a clean exit | last: ' + (window.localStorage.getItem('__trash_ctx') || ''), shot);
			}, 1500);
		}
	} catch (e) {}
	try {
		if (navigator.getBattery) {
			navigator.getBattery().then(function (b) { battery = b; });
		}
	} catch (e) {}

	window.trkReport = function (kind, text, extra) {
		if (!REPORT_URL || reportCount >= REPORT_CAP) {
			return;
		}
		try {
			text = String(text);
			const key = kind + text.slice(0, 100);
			if (sentKeys[key]) {
				return;
			}
			sentKeys[key] = true;
			reportCount += 1;
			const heavy = kind !== 'heartbeat';
			const env = envInfo();
			let full = '[' + SESSION_ID + ' +' + Math.round((Date.now() - SESSION_START) / 1000) + 's] ' + text.slice(0, 3000);
			full += '\nENV ' + JSON.stringify(env);
			if (heavy && kind !== 'session_start') {
				full += '\nEVENTS ' + eventLog.slice(-25).join(' ; ') + '\nCONSOLE ' + logTail.slice(-15).join(' ; ');
				let where = '';
				try { where = window.localStorage.getItem('__trash_ctx') || ''; } catch (e) {}
				full += '\nWHERE ' + where.slice(0, 300) + '\nTRAIL ' + (window.__trash_trail || []).join(' ; ');
			}
			full = full.slice(0, 8000);
			// Копия ошибки для журнала в базе (вкладка «Ошибки» у DeV). Игра отправит её сама, даже в следующий запуск.
			if (kind === 'error' || kind === 'webgl_context_lost' || kind === 'prev_session_died' || kind === 'unclean_exit') {
				try {
					const q = JSON.parse(window.localStorage.getItem('__trash_errq') || '[]');
					q.push(kind + ': ' + full.slice(0, 3500));
					window.localStorage.setItem('__trash_errq', JSON.stringify(q.slice(-20)));
				} catch (e) {}
			}
			if (extra) {
				full += '\nSHOT ' + String(extra).slice(0, 30000);
			}
			const payload = {
				kind: kind,
				text: full,
				time: new Date().toISOString(),
				build: window.__trash_build.label,
				buildId: BUILD_ID_REPORT,
				session: SESSION_ID,
				env: env
			};
			if (heavy && kind !== 'session_start') {
				payload.events = eventLog.slice(-25);
				payload.console = logTail.slice(-15);
			}
			const body = JSON.stringify(payload);
			if (navigator.sendBeacon) {
				navigator.sendBeacon(REPORT_URL, body);
			} else {
				fetch(REPORT_URL, { method: 'POST', body: body, keepalive: true, mode: 'no-cors' });
			}
		} catch (e) {}
	};

	document.addEventListener('visibilitychange', function () {
		noteEvent('visibility ' + document.visibilityState);
		if (document.visibilityState === 'hidden') {
			hiddenSince = Date.now();
		} else if (hiddenSince) {
			hiddenMs += Date.now() - hiddenSince;
			hiddenSince = 0;
		}
	});
	window.addEventListener('pagehide', function () {
		let ctx = '';
		try { ctx = window.localStorage.getItem('__trash_ctx') || ''; } catch (e) {}
		window.trkReport('session_end', Math.round((Date.now() - SESSION_START) / 1000) + 's | last: ' + ctx);
	});
	window.addEventListener('orientationchange', function () { noteEvent('orientationchange ' + window.innerWidth + 'x' + window.innerHeight); });
	window.addEventListener('online', function () { noteEvent('online'); });
	window.addEventListener('offline', function () { noteEvent('offline'); });
	window.addEventListener('pagehide', function (event) {
		noteEvent('pagehide persisted=' + event.persisted);
		try { window.localStorage.removeItem('__trash_shot'); } catch (e) {}
	});

	});

		const stack = event.error && event.error.stack ? String(event.error.stack).split('\n').slice(0, 14).map(function (l) { return l.replace(/^\s*at\s+/, '').slice(0, 40); }).join(' < ') : '';
		window.trkReport('error', 'js: ' + event.message + ' @ ' + (event.filename || '').split('/').pop() + ':' + event.lineno + (stack ? ' | stack: ' + stack : ''));
	});

	let beats = 0;
	setInterval(function () {
		if (document.visibilityState !== 'visible' || beats >= 40) { return; }
		let ctx = '';
		try { ctx = window.localStorage.getItem('__trash_ctx') || ''; } catch (e) {}
		if (ctx.indexOf('t=') < 0) { return; }

		window.trkReport('heartbeat', ctx + ' | beat ' + beats);
	}, 45000);

		window.trkReport('test', 'Проверка связи: ' + navigator.userAgent);
	}

	window.trkReport('session_start', gpuInfo() + ' | ' + navigator.userAgent + ' | mem ' + (navigator.deviceMemory || '?') + 'GB | dpr ' + (window.__trash_real_dpr ? window.__trash_real_dpr() : window.devicePixelRatio) + ' | screen ' + screen.width + 'x' + screen.height + ' | cores ' + (navigator.hardwareConcurrency || '?'));

	const BUILD_ID = '__BUILD_ID__';
	// Важное обновление: старая сборка дальше не работает, иначе аккаунты и сохранения ломаются старым кодом.
	function blockOldBuild(v) {
		const wall = document.createElement('div');
		wall.id = 'mustupdate';
		wall.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:rgba(10,6,24,.96);color:#fff;font:600 17px system-ui,sans-serif;text-align:center';
		const title = document.createElement('div');
		title.style.cssText = 'font:800 26px system-ui,sans-serif;color:#00d5ec';
		title.textContent = 'Вышло важное обновление';
		const text = document.createElement('div');
		text.style.cssText = 'max-width:420px;line-height:1.4;color:#c3dbe6';
		text.textContent = 'Эта версия игры устарела и больше не запускается: так твой аккаунт и прогресс точно не пострадают. Обновление займёт пару секунд, енот подождёт.';
		const btn = document.createElement('button');
		btn.style.cssText = 'padding:16px 34px;border:0;border-radius:14px;background:#00d5ec;color:#04202a;font:800 20px system-ui,sans-serif';

	var updateDismissed = false;
	window.__trkUpdateUi = function () {
		const v = window.__trkNewVer;
		let bar = document.getElementById('newver');
		let wall = document.getElementById('newverwall');
		if (!v) { return; }
		if (window.__trkBattle) {
			if (bar) { bar.style.display = 'none'; }
			if (wall) { wall.style.display = 'none'; }
			return;
		}
		if (!updateDismissed) {
			if (!wall) {
				wall = document.createElement('div');
				wall.id = 'newverwall';
				wall.style.cssText = 'position:fixed;inset:0;z-index:98;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,14,22,.86)';
				const card = document.createElement('div');
				card.style.cssText = 'max-width:380px;width:100%;box-sizing:border-box;padding:26px 22px;border-radius:22px;background:#162c36;border:3px solid #00e5ff;box-shadow:0 0 28px rgba(0,229,255,.35);text-align:center;color:#fff;font:600 16px system-ui,sans-serif';
				card.innerHTML = '<div style="font:800 24px system-ui,sans-serif;color:#ffd257;margin-bottom:10px">Вышла новая версия</div><div style="line-height:1.4;color:#c3dbe6;margin-bottom:18px">Обнови игру: новые фичи и починенные баги уже ждут. Забег идёт только в меню, прогресс сохранён.</div>';
				const go = document.createElement('button');
				go.style.cssText = 'display:block;width:100%;padding:16px;border:0;border-radius:14px;background:#00d5ec;color:#04202a;font:800 20px system-ui,sans-serif;margin-bottom:10px';
				go.textContent = 'ОБНОВИТЬ';
				go.addEventListener('click', function () { window.location.reload(); });
				const later = document.createElement('button');
				later.style.cssText = 'display:block;width:100%;padding:12px;border:0;border-radius:12px;background:#244452;color:#c3dbe6;font:700 16px system-ui,sans-serif';
				later.textContent = 'ПОЗЖЕ';
				later.addEventListener('click', function () { updateDismissed = true; wall.style.display = 'none'; window.__trkUpdateUi(); });
				card.appendChild(go); card.appendChild(later); wall.appendChild(card);
				document.body.appendChild(wall);
			}
			wall.style.display = 'flex';
			if (bar) { bar.style.display = 'none'; }
			return;
		}
		if (!bar) {
			bar = document.createElement('div');
			bar.id = 'newver';
			bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9;padding:10px 14px;background:#00d5ec;color:#fff;font:600 15px system-ui,sans-serif;text-align:center;cursor:pointer';
			bar.textContent = 'Вышла новая версия игры. Нажми, чтобы обновить.';
			bar.addEventListener('click', function () { window.location.reload(); });
			document.body.appendChild(bar);
		}
		bar.style.display = 'block';
	};
	function checkVersion() {
		fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
			if (v && v.min_build && Number(BUILD_ID) < Number(v.min_build) && !document.getElementById('mustupdate')) {
				if (!window.__trkBattle) { blockOldBuild(v); }   // посреди забега не рубим игру: проверим снова, когда выйдет в меню
				return;
			}
			if (v && v.build && v.build !== BUILD_ID) {
				window.__trkNewVer = v;
				window.__trkUpdateUi();
			}
		}).catch(function () {});
	}
	window.__trkCheck = checkVersion;
	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'visible') {
			checkVersion();
		}
	});
	setTimeout(checkVersion, 1500);
	setInterval(checkVersion, 300000);
	// Закэшированная страница старой сборки: один раз принудительно перезагружаемся на свежую.
	fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
		if (v && v.build && v.build !== BUILD_ID) {
			let tries = 0;
			try { tries = Number(sessionStorage.getItem('trk_reload') || 0); sessionStorage.setItem('trk_reload', String(tries + 1)); } catch (e) {}
			if (tries < 2) {
				window.location.replace(window.location.pathname + '?v=' + v.build);
			}
		}
	}).catch(function () {});

	let started = false;
	let crashed = false;

	// Android после сворачивания вкладки теряет шейдеры: экран остаётся чёрным или без спрайтов. Перезагрузка лечит, не чаще раза в 20 с.
	function recoverGraphics() {
		try {
			const last = Number(sessionStorage.getItem('__trash_ctx_reload') || 0);
			if (Date.now() - last < 20000) {
				return;
			}
			const count = Number(sessionStorage.getItem('__trash_shader_reloads') || 0);
			if (count >= 2) {
				return;
			}
			sessionStorage.setItem('__trash_shader_reloads', String(count + 1));
			sessionStorage.setItem('__trash_ctx_reload', String(Date.now()));
			window.trkReport('shader_reload', logTail.slice(-6).join(' ; '));
		} catch (e) {}
		setTimeout(function () { window.location.reload(); }, 500);
	}

	function keepLog(kind, args) {
		const line = Array.prototype.join.call(args, ' ').slice(0, 300);
		logTail.push(kind + ': ' + line);
		if (logTail.length > 30) {
			logTail.shift();
		}
		if (started && line.indexOf('shader compilation failed') !== -1) {
			recoverGraphics();
		}
	}

	// Вылет уже запущенной игры: показываем текст ошибки и последние строки лога движка,
	// чтобы тестер мог скопировать их и прислать. Сохранённый прогресс не затрагивается.
	function crash(message) {
		if (crashed || !started) {
			return;
		}
		crashed = true;
		const ua = navigator.userAgent + ' | mem ' + (navigator.deviceMemory || '?') + 'GB | dpr ' + window.devicePixelRatio;
		const report = 'CRASH: ' + message + '\n' + ua + '\n--- лог ---\n' + logTail.slice(-15).join('\n');
		try {
			window.localStorage.setItem('trk_last_crash', report);
		} catch (e) {}
		window.trkReport('crash', report);
		document.getElementById('crashlog').textContent = report;
		document.getElementById('crash').classList.add('show');
	}

	document.getElementById('crashreload').addEventListener('click', function () {
		window.location.reload();
	});
	document.getElementById('crashcopy').addEventListener('click', function () {
		const text = document.getElementById('crashlog').textContent;
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(text).catch(function () {});
		}
	});

	const boot = document.getElementById('boot');
	const fill = document.getElementById('fill');
	const statusEl = document.getElementById('status');
	const errorEl = document.getElementById('error');
	const retryBtn = document.getElementById('retry');
	function sumBytes(parts) {
		return parts.reduce(function (acc, part) { return acc + part.bytes; }, 0);
	}
	FILES.wasm.bytes = sumBytes(FILES.wasm.parts);
	FILES.pck.bytes = sumBytes(FILES.pck.parts);
	const loaded = { wasm: 0, pck: 0 };
	const loadedParts = { wasm: FILES.wasm.parts.map(function () { return 0; }), pck: FILES.pck.parts.map(function () { return 0; }) };
	const total = FILES.wasm.bytes + FILES.pck.bytes;
	let failed = false;

	function mb(n) {
		return (n / 1048576).toFixed(1).replace('.', ',');
	}

	const pctEl = document.getElementById('pct');
	const tipEl = document.getElementById('tip');
	const TIPS = [
		'Собирай неонит на свалке: он открывает героев и слоты.',
		'Снайпер сильнее, когда стоишь на месте. Дробовик - вблизи.',
		'Рывок спасает от удара босса - жми вовремя.',
		'Бесплатный сундук в меню доступен раз в несколько часов.',
		'Вампиризм копится медленно - не рассчитывай на бессмертие.'
	];
	let shown = 0;
	let target = 0;
	let ticking = false;
	tipEl.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

	function frame() {
		shown += (target - shown) * 0.18;
		if (Math.abs(target - shown) < 0.15) {
			shown = target;
		}
		fill.style.width = shown.toFixed(1) + '%';
		pctEl.textContent = Math.floor(shown) + '%';
		if (shown !== target) {
			requestAnimationFrame(frame);
		} else {
			ticking = false;
		}
	}

	function renderProgress() {
		const done = loaded.wasm + loaded.pck;
		target = Math.min(100, (done / total) * 100);
		statusEl.textContent = 'Загрузка ' + mb(done) + ' из ' + mb(total) + ' МБ';
		if (!ticking) {
			ticking = true;
			requestAnimationFrame(frame);
		}
	}

	const QUIPS = {
		net: {
			titles: ['Связь с свалкой потеряна', 'Интернет ушёл за пивом', 'Енот остался без сети', 'Тут только тишина и мусор', 'Провода кто-то сгрыз'],
			lines: [
				'Даже крысы-перекупы онлайн, а ты нет. Проверь Wi-Fi или мобильный интернет.',
				'Игра грузится из интернета, а интернета у тебя сейчас нет. Логика железная.',
				'Скорее всего, роутер обиделся. Постучи по нему и попробуй ещё раз.',
				'Свалка на связи, а ты где-то в цифровой пустоте. Включи интернет и возвращайся.',
				'Мы честно пытались достучаться до сервера. Сервер сделал вид, что не слышит.',
				'Без сети енот не воюет. Найди сигнал, хоть на крыше, хоть у соседа.'
			],
			buttons: ['Дёрнуть рубильник', 'Ещё разок, с чувством', 'Попробовать снова', 'Реанимировать']
		},
		engine: {
			titles: ['Движок завис', 'Енот уснул на старте', 'Что-то пошло по помойке'],
			lines: [
				'Закрой лишние вкладки, пусть телефон выдохнет, и попробуй ещё раз.',
				'Телефон не потянул. Бывает, свалка тяжёлая. Освободи память и перезапусти.',
				'Движок задумался о смысле жизни. Подождать не вариант, перезапусти.'
			],
			buttons: ['Пнуть движок', 'Перезапустить', 'Ещё разок']
		},
		wasm: {
			titles: ['Браузер упёрся', 'Не тот браузер'],
			lines: [
				'Этот браузер не умеет запускать игру. Открой ссылку в Safari или Chrome.',
				'Встроенный просмотрщик режет всё, что интереснее текста. Открой в обычном браузере.'
			],
			buttons: ['Попробовать ещё раз', 'Ещё разок']
		}
	};

	function pick(list) {
		return list[Math.floor(Math.random() * list.length)];
	}

	function fail(message, canRetry, kind) {
		if (failed) {
			return;
		}
		failed = true;
		const set = QUIPS[kind || 'net'];
		statusEl.hidden = true;
		tipEl.hidden = true;
		errorEl.textContent = '';
		const head = document.createElement('strong');
		head.textContent = pick(set.titles);
		head.style.display = 'block';
		head.style.marginBottom = '6px';
		head.style.fontSize = '17px';
		head.style.color = 'var(--pink)';
		const body = document.createElement('span');
		body.textContent = pick(set.lines);
		errorEl.appendChild(head);
		errorEl.appendChild(body);
		if (message) {
			const tech = document.createElement('small');
			tech.textContent = message;
			tech.style.display = 'block';
			tech.style.marginTop = '8px';
			tech.style.opacity = '0.55';
			tech.style.fontSize = '11px';
			errorEl.appendChild(tech);
		}
		errorEl.hidden = false;
		retryBtn.textContent = pick(set.buttons);
		retryBtn.hidden = !canRetry;
	}

	retryBtn.addEventListener('click', function () {
		window.location.reload();
	});

	function checkSupport() {
		try {
			new WebAssembly.Module(Uint8Array.of(0, 97, 115, 109, 1, 0, 0, 0));
		} catch (e) {
			return 'Этот просмотрщик запрещает WebAssembly, а без него игра не запускается.\n' +
				'Откройте ссылку в Safari или Chrome (кнопка «Открыть в браузере»).';
		}
		const probe = document.createElement('canvas');
		if (!probe.getContext('webgl2')) {
			return 'Браузер не поддерживает WebGL 2.\nОбновите iOS / браузер до свежей версии.';
		}
		return '';
	}

	// Файл игры режется на части (лимит хостинга — 15 МБ на файл): части качаются параллельно,
	// каждая распаковывается отдельно, затем склеиваются в исходный файл по порядку.
	function updatePart(key, index, value) {
		loadedParts[key][index] = value;
		loaded[key] = loadedParts[key].reduce(function (acc, n) { return acc + n; }, 0);
		renderProgress();
	}

	function downloadPart(key, index) {
		const part = FILES[key].parts[index];
		return fetch(part.url, { cache: 'force-cache' }).then(function (response) {
			// Размер не совпал с ожидаемым: в кэше чужая версия части. Качаем заново мимо кэша.
			const size = Number(response.headers.get('content-length') || 0);
			if (response.ok && size > 0 && !response.headers.get('content-encoding') && size !== part.bytes && !part.retried) {
				part.retried = true;
				return fetch(part.url, { cache: 'reload' });
			}
			return response;
		}).then(function (response) {
			if (!response.ok) {
				throw new Error('HTTP ' + response.status + ' на ' + part.url);
			}
			if (!response.body || !response.body.getReader) {
				return response.arrayBuffer().then(function (buffer) {
					updatePart(key, index, part.bytes);
					return new Uint8Array(buffer);
				});
			}
			const reader = response.body.getReader();
			const chunks = [];
			let size = 0;
			function pump() {
				return reader.read().then(function (step) {
					if (step.done) {
						const out = new Uint8Array(size);
						let offset = 0;
						for (const chunk of chunks) {
							out.set(chunk, offset);
							offset += chunk.length;
						}
						updatePart(key, index, part.bytes);
						return out;
					}
					chunks.push(step.value);
					size += step.value.length;
					updatePart(key, index, Math.min(size, part.bytes));
					return pump();
				});
			}
			return pump();
		}).then(gunzipIfNeeded);
	}

	function download(key) {
		return Promise.all(FILES[key].parts.map(function (part, index) {
			return downloadPart(key, index);
		})).then(function (pieces) {
			if (pieces.length === 1) {
				return pieces[0];
			}
			let length = 0;
			for (const piece of pieces) {
				length += piece.length;
			}
			const out = new Uint8Array(length);
			let offset = 0;
			for (const piece of pieces) {
				out.set(piece, offset);
				offset += piece.length;
			}
			pieces.length = 0;
			return out;
		});
	}

	// Хост может сам отдать .gz с Content-Encoding: gzip — тогда байты уже распакованы.
	function gunzipIfNeeded(bytes) {
		if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) {
			return Promise.resolve(bytes);
		}
		if (typeof DecompressionStream === 'function') {
			const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
			return new Response(stream).arrayBuffer().then(function (buffer) {
				return new Uint8Array(buffer);
			});
		}
		if (window.pako) {
			return Promise.resolve(window.pako.inflate(bytes));
		}
		return Promise.reject(new Error('Браузер не умеет распаковывать gzip.'));
	}

	// Мост держит распакованные байты (~50 МБ) только до старта движка: после этого Godot уже
	// скопировал их к себе, и release() отпускает копии — на телефоне это заметная экономия памяти.
	function installFetchBridge(wasmBytes, pckBytes) {
		const nativeFetch = window.fetch.bind(window);
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : (input && input.url) || '';
			const path = url.split('?')[0].split('#')[0];
			if (/(^|\/)index\.wasm$/.test(path)) {
				return Promise.resolve(new Response(wasmBytes, { status: 200, headers: { 'Content-Type': 'application/wasm' } }));
			}
			if (/(^|\/)index\.pck$/.test(path)) {
				return Promise.resolve(new Response(pckBytes, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } }));
			}
			return nativeFetch(input, init);
		};
		return function release() {
			wasmBytes = null;
			pckBytes = null;
			window.fetch = nativeFetch;
		};
	}

	function start() {
		const problem = checkSupport();
		if (problem) {
			fail(problem, false, 'wasm');
			return;
		}
		renderProgress();
		Promise.all([download('wasm'), download('pck')]).then(function (parts) {
			statusEl.textContent = 'Запускаем движок…';
			target = 100;
			fill.style.width = '100%';
			pctEl.textContent = '100%';
			const release = installFetchBridge(parts[0], parts[1]);
			parts.length = 0;
			const engine = new Engine(GODOT_CONFIG);
			const watchdog = setTimeout(function () {
				fail('Движок не запустился за 40 секунд.', true, 'engine');
			}, 40000);
			return engine.startGame({}).then(function () {
				clearTimeout(watchdog);
				started = true;
				if (window.trkLoaded) { window.trkLoaded(); }
				release();
				if (failed) {
					return;
				}
				boot.classList.add('gone');
				setTimeout(function () {
					boot.remove();
				}, 400);
			});
		}).catch(function (err) {
			console.error(err);
			const text = err && err.message ? err.message : String(err);
			fail(text, true, navigator.onLine === false || /fetch|network|load|HTTP|timeout/i.test(text) ? 'net' : 'engine');
		});
	}

	window.addEventListener('unhandledrejection', function (event) {
		const reason = event.reason;
		const text = reason && reason.message ? reason.message : String(reason);
		if (/WebAssembly|wasm/i.test(text)) {
			fail(text, true, 'wasm');
		}
	});

	const CRASH_PATTERN = /Aborted|abort\(|out of memory|memory access out of bounds|unreachable|RuntimeError|Cannot enlarge/i;
	window.addEventListener('unhandledrejection', function (event) {
		const reason = event.reason;
		const text = reason && reason.message ? reason.message : String(reason);
		if (CRASH_PATTERN.test(text)) {
			crash(text);
		}
	});
	window.addEventListener('error', function (event) {
		const text = event.message || (event.error && event.error.message) || '';
		if (CRASH_PATTERN.test(text)) {
			crash(text);
		}
	});

	start();
}());
</script>
