# TrashSquad (Beer Party Studio) — тестовая сборка Android: при пуше собирает подписанный APK и отправляет его тестерам через
# Firebase App Distribution (группа testers); копия APK — в артефактах запуска.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 — base64 файла trashketeers-beta.keystore
#   ANDROID_KEYSTORE_PASSWORD — пароль хранилища и ключа (алиас trashketeers)
#   FIREBASE_TESTERS — (необязательно) почты тестеров через запятую: им сборка уйдёт вдобавок к группе testers
#   FIREBASE_SERVICE_ACCOUNT — JSON ключа сервисного аккаунта с ролью Firebase App Distribution Admin
name: Android beta

on:
  push:
    branches: [main]
    paths: ["source/**", "android-updater/**", "tools/android_version.py", ".github/workflows/android-beta.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Godot и шаблоны экспорта (кэш)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-v2

      - name: Скачать Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip
          curl -sSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q t.tpz 'templates/android*' && rm t.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Собрать обновлятор и подключить Android-плагин
        run: |
          gradle -p android-updater --no-daemon assembleRelease
          mkdir -p source/android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d source/android/build
          printf '%s\n' "${GODOT_VERSION}.stable" > source/android/.build_version
          touch source/android/build/.gdignore
          chmod +x source/android/build/gradlew
          mkdir -p source/android/build/libs/release source/android/build/libs/debug
          cp android-updater/build/outputs/aar/TrashSquadUpdater-release.aar source/android/build/libs/release/
          cp android-updater/build/outputs/aar/TrashSquadUpdater-release.aar source/android/build/libs/debug/

      - name: Ключи и настройки редактора
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Нет секрета ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta.keystore"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Номер версии
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" source/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"beta.${GITHUB_RUN_NUMBER}\"/" source/export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"beta.${GITHUB_RUN_NUMBER}\"/" source/project.godot

      - name: Импорт и экспорт APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/beta.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: trashketeers
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $GODOT --headless --path source --import > import.log 2>&1 || true
          XDG_DATA_HOME="$RUNNER_TEMP/updater-test-user" $GODOT --headless --path source res://test/app_updater_test.tscn > updater-test.log 2>&1
          grep -q 'APP_UPDATER_TEST failures=0' updater-test.log
          if grep -q 'SCRIPT ERROR' updater-test.log; then exit 1; fi
          mkdir -p source/build/android
          $GODOT --headless --path source --export-release "Android" build/android/TrashSquad.apk 2>&1 | tee export.log
          test -f source/build/android/TrashSquad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrashSquad-beta-${{ github.run_number }}
          path: source/build/android/TrashSquad.apk

      # Постоянная ссылка на свежий APK + номер версии: по ним игра сама предлагает «ОБНОВИТЬ» (core/app_updater.gd).
      - name: Файл версии для автообновления
        run: |
          python3 tools/android_version.py source/build/android/TrashSquad.apk "$GITHUB_RUN_NUMBER" > source/build/android/android-version.json
          cat source/build/android/android-version.json

      - name: Релиз android-beta на GitHub (для автообновления)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta
          name: TrashSquad beta (Beer Party Studio)
          body: |
            TrashSquad · Beer Party Studio · beta.${{ github.run_number }}

            Galaxy A13 (4G и 5G): автоматические 30 FPS, адаптивное разрешение и оптимизированный расчёт расталкивания врагов без временных массивов на каждом кадре. Ручной лимит кадров сохраняется.

            APK: TrashSquad.apk. Производительность на физическом Galaxy A13 проверяется тестерами.
          prerelease: true
          make_latest: false
          files: |
            source/build/android/TrashSquad.apk
            source/build/android/android-version.json

      - name: Отправить тестерам (Firebase App Distribution)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:80820379449:android:83df21951e3a0f0fc7d2e8
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: source/build/android/TrashSquad.apk
          releaseNotes: "TrashSquad beta.${{ github.run_number }} · Beer Party Studio · ${{ github.ref_name }} · ${{ github.event.head_commit.message }}"
