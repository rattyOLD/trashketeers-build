<div id="viewport-probe"></div><div id="boot" aria-hidden="true"></div>

<script>
(function () {
    'use strict';
    var frame = document.getElementById('game-frame');
    var probe = document.getElementById('viewport-probe');

    var attempted = false, installer = null, manifestURL = '', pendingFullscreen = null;

            catch (error) { return Promise.resolve(false); }

        if (pendingFullscreen) { return pendingFullscreen; }

            pendingFullscreen = Promise.resolve(enter ? enter.call(document.documentElement, {navigationUI:'hide'}) : false)
                .then(lock).catch(function () { return false; }).finally(function () { pendingFullscreen = null; });

    }
    function typing() {
        try { var active = frame.contentDocument.activeElement; return active && /INPUT|TEXTAREA/.test(active.tagName); }
        catch (error) { return false; }

    var lastPortrait = innerHeight > innerWidth;
    function portrait() {
        if (screen.orientation && screen.orientation.type) { return screen.orientation.type.indexOf('portrait') === 0; }
        if (typeof window.orientation === 'number') { return Math.abs(window.orientation) % 180 === 0; }
        if (!typing()) { lastPortrait = innerHeight > innerWidth; }

        var viewport = window.visualViewport;

        if (viewport && Math.abs(viewport.scale - 1) < 0.01) { width = Math.min(width, viewport.width); height = Math.min(height, viewport.height); }
        var style = getComputedStyle(probe);
        var top = parseFloat(style.paddingTop) || 0, right = parseFloat(style.paddingRight) || 0;
        var bottom = parseFloat(style.paddingBottom) || 0, left = parseFloat(style.paddingLeft) || 0;

        height = Math.max(1, Math.round(height - top - bottom));

        frame.style.top = (top + (typing() && viewport ? viewport.offsetTop : 0)) + 'px';

        frame.style.height = (rotate ? width : height) + 'px';

        canInstall:function () { return !!installer; },

        syncURL:function (search, hash) { var params = new URLSearchParams(search); params.delete('_build'); history.replaceState(null,'',location.pathname + (params.size ? '?' + params.toString() : '') + hash); },
        reloadClean:function () { location.replace(location.pathname); },

    });

    addEventListener('resize',fit); addEventListener('orientationchange',function () { fit(); setTimeout(fit,300); });
