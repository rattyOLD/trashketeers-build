// Свернул игру — звук и аудиосессия засыпают целиком. Иначе iOS держит сайт как «плеер» на экране блокировки и в фоне.
(function () {
	const Orig = window.AudioContext || window.webkitAudioContext;
	if (!Orig) { return; }
	const all = [];
	function Tracked(opts) { const ctx = new Orig(opts); all.push(ctx); return ctx; }
	Tracked.prototype = Orig.prototype;
	window.AudioContext = Tracked;
	if (window.webkitAudioContext) { window.webkitAudioContext = Tracked; }
	function sync() {
		const hidden = document.visibilityState === 'hidden';
		all.forEach(function (ctx) {
			try {
				if (hidden && ctx.state === 'running') { ctx.suspend(); }
				if (!hidden && ctx.state === 'suspended') { ctx.resume(); }
			} catch (e) {}
		});
		if (hidden && navigator.mediaSession) { try { navigator.mediaSession.playbackState = 'none'; } catch (e) {} }
	}
	document.addEventListener('visibilitychange', sync);
	window.addEventListener('pagehide', function () { all.forEach(function (ctx) { try { ctx.suspend(); } catch (e) {} }); });
})();

<script>
(function () {
	'use strict';
	// iOS Safari меняет размер окна после поворота с задержкой и не всегда шлёт resize — движок остаётся со старым размером холста.
	var kickTimers = [];
	var kick = function (event) {
		if (event && event.isTrusted === false) {
			return;
		}
		kickTimers.forEach(clearTimeout);
		kickTimers = [250, 900, 2000].map(function (ms) {
			return setTimeout(function () { window.dispatchEvent(new Event('resize')); }, ms);
		});
	};
	try { if (screen.orientation && screen.orientation.lock && window.matchMedia('(pointer: coarse)').matches) { screen.orientation.lock('portrait').catch(function () {}); } } catch (e) {}
	var phone = false;
	try { phone = window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 700; } catch (e) {}
	var judge = function () {
		var sideways = phone && window.innerWidth > window.innerHeight * 1.05;
		document.documentElement.classList.toggle('sideways', sideways);
	};
	judge();
	setInterval(judge, 300);
	window.addEventListener('orientationchange', function () { judge(); setTimeout(judge, 400); });
	window.addEventListener('orientationchange', kick);
	window.addEventListener('resize', judge);
	window.addEventListener('resize', kick);

	// держим холст в видимой части (сдвиг на offsetTop), игра сама сожмёт окно по высоте видимой области.
	// Браузерные поля ввода лежат поверх холста по координатам игры, поэтому после каждого сдвига их кладём заново.
	var vv = window.visualViewport;
	if (vv) {
		var relayout = function () {
			var cv = document.getElementById('canvas');
			if (!cv) { return; }
			var r = cv.getBoundingClientRect();
			document.querySelectorAll('input[id^=trk_in_]').forEach(function (el) {
				var d = el.dataset;
				if (!d.gx) { return; }
				var k = r.width / Number(d.vw);
				el.style.left = (r.left + Number(d.gx) * k) + 'px';
				el.style.top = (r.top + Number(d.gy) * k) + 'px';
				el.style.width = (Number(d.gw) * k) + 'px';
				el.style.height = (Number(d.gh) * k) + 'px';
			});

		var typingUntil = 0;

			if (Date.now() < typingUntil || (document.activeElement && String(document.activeElement.id).indexOf('trk_in_') === 0)) { follow(); }

		};

		vv.addEventListener('scroll', follow);
		document.addEventListener('focusin', function () { typingUntil = Date.now() + 700; follow(); });
		document.addEventListener('focusout', function () { typingUntil = Date.now() + 700; });
	}
})();

/* Адрес, с которым iOS кладёт игру на экран «Домой». Аккаунт с логином: мини-апка открывается с окном входа
   (?login=имя). Гость: скрытый вход (?g=guest_….пароль) — мини-апка входит в тот же аккаунт, ничего не переносится.
   Старый код восстановления (?restore=) — только если скрытого входа ещё нет (он ПЕРЕНОСИТ гостя). */
(function () {
	var baseManifest = document.querySelector('link[rel="manifest"]');
	var lastKey = '';
	function sync() {
		var code = '', login = '', guest = '';
		try {
			code = window.localStorage.getItem('trk_recovery_code') || '';
			login = window.localStorage.getItem('trk_cloud_email') || '';
			guest = window.localStorage.getItem('trk_guest_key') || '';
		} catch (e) { return; }
		var key = '', value = '';
		if (/^[a-z0-9_]{3,20}$/.test(login)) { key = 'login'; value = login; }
		else if (/^guest_[a-z0-9]{12}\.[A-Za-z0-9]{24}$/.test(guest)) { key = 'g'; value = guest; }
		else if (/^[A-Za-z0-9]{8,24}$/.test(code)) { key = 'restore'; value = code; }
		if (!key || key + value === lastKey) { return; }
		lastKey = key + value;
		var params = new URLSearchParams(location.search);
		params.delete('restore');
		params.delete('login');
		params.delete('g');
		params.set(key, value);
		try { history.replaceState(null, '', location.pathname + '?' + params.toString() + location.hash); } catch (e) {}
		if (baseManifest) {
			try {
				var m = {name: 'Trash Squad', short_name: 'Trash Squad', start_url: location.pathname + '?' + key + '=' + encodeURIComponent(value), scope: location.pathname,
					display: 'fullscreen', orientation: 'portrait', background_color: '#0d0a1c', theme_color: '#0d0a1c',
					icons: [{src: new URL('icon192.png', location.href).href, sizes: '192x192', type: 'image/png'}, {src: new URL('icon512.png', location.href).href, sizes: '512x512', type: 'image/png'}]};
				baseManifest.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type: 'application/manifest+json'}));
			} catch (e) {}
		}
	}
	setInterval(sync, 3000);
	setTimeout(sync, 1500);
})();

		const done = loaded.wasm + loaded.pck;
		target = Math.min(100, (done / total) * 100);
		statusEl.textContent = 'Загрузка ' + mb(done) + ' из ' + mb(total) + ' МБ';
		if (!ticking) {
			ticking = true;
			requestAnimationFrame(frame);
		}
	}

	const QUIPS = {
		net: {
			titles: ['Связь с свалкой потеряна', 'Интернет ушёл за пивом', 'Енот остался без сети', 'Тут только тишина и мусор', 'Провода кто-то сгрыз'],
			lines: [
				'Даже крысы-перекупы онлайн, а ты нет. Проверь Wi-Fi или мобильный интернет.',
				'Игра грузится из интернета, а интернета у тебя сейчас нет. Логика железная.',
				'Скорее всего, роутер обиделся. Постучи по нему и попробуй ещё раз.',
				'Свалка на связи, а ты где-то в цифровой пустоте. Включи интернет и возвращайся.',
				'Мы честно пытались достучаться до сервера. Сервер сделал вид, что не слышит.',
				'Без сети енот не воюет. Найди сигнал, хоть на крыше, хоть у соседа.'
			],
			buttons: ['Дёрнуть рубильник', 'Ещё разок, с чувством', 'Попробовать снова', 'Реанимировать']
		},
		engine: {
			titles: ['Движок завис', 'Енот уснул на старте', 'Что-то пошло по помойке'],
			lines: [
				'Закрой лишние вкладки, пусть телефон выдохнет, и попробуй ещё раз.',
				'Телефон не потянул. Бывает, свалка тяжёлая. Освободи память и перезапусти.',
				'Движок задумался о смысле жизни. Подождать не вариант, перезапусти.'
			],
			buttons: ['Пнуть движок', 'Перезапустить', 'Ещё разок']
		},
		wasm: {
			titles: ['Браузер упёрся', 'Не тот браузер'],
			lines: [
				'Этот браузер не умеет запускать игру. Открой ссылку в Safari или Chrome.',
				'Встроенный просмотрщик режет всё, что интереснее текста. Открой в обычном браузере.'
			],
			buttons: ['Попробовать ещё раз', 'Ещё разок']
		}
	};

	function pick(list) {
		return list[Math.floor(Math.random() * list.length)];
	}

	function fail(message, canRetry, kind) {
		if (failed) {
			return;
		}
		failed = true;
		const set = QUIPS[kind || 'net'];
		statusEl.hidden = true;
		tipEl.hidden = true;
		errorEl.textContent = '';
		const head = document.createElement('strong');
		head.textContent = pick(set.titles);
		head.style.display = 'block';
		head.style.marginBottom = '6px';
		head.style.fontSize = '17px';
		head.style.color = 'var(--pink)';
		const body = document.createElement('span');
		body.textContent = pick(set.lines);
		errorEl.appendChild(head);
		errorEl.appendChild(body);
		if (message) {
			const tech = document.createElement('small');
			tech.textContent = message;
			tech.style.display = 'block';
			tech.style.marginTop = '8px';
			tech.style.opacity = '0.55';
			tech.style.fontSize = '11px';
			errorEl.appendChild(tech);
		}
		errorEl.hidden = false;
		retryBtn.textContent = pick(set.buttons);
		retryBtn.hidden = !canRetry;
	}

	retryBtn.addEventListener('click', function () {
		window.location.reload();
	});

	function checkSupport() {
		try {
			new WebAssembly.Module(Uint8Array.of(0, 97, 115, 109, 1, 0, 0, 0));
		} catch (e) {
			return 'Этот просмотрщик запрещает WebAssembly, а без него игра не запускается.\n' +
				'Откройте ссылку в Safari или Chrome (кнопка «Открыть в браузере»).';
		}
		const probe = document.createElement('canvas');
		if (!probe.getContext('webgl2')) {
			return 'Браузер не поддерживает WebGL 2.\nОбновите iOS / браузер до свежей версии.';
		}
		return '';
	}

	// Файл игры режется на части (лимит хостинга — 15 МБ на файл): части качаются параллельно,
	// каждая распаковывается отдельно, затем склеиваются в исходный файл по порядку.
	function updatePart(key, index, value) {
		loadedParts[key][index] = value;
		loaded[key] = loadedParts[key].reduce(function (acc, n) { return acc + n; }, 0);
		renderProgress();
	}

	function downloadPart(key, index) {
		const part = FILES[key].parts[index];
		return fetch(part.url, { cache: 'force-cache' }).then(function (response) {
			// Размер не совпал с ожидаемым: в кэше чужая версия части. Качаем заново мимо кэша.
			const size = Number(response.headers.get('content-length') || 0);
			if (response.ok && size > 0 && !response.headers.get('content-encoding') && size !== part.bytes && !part.retried) {
				part.retried = true;
				return fetch(part.url, { cache: 'reload' });
			}
			return response;
		}).then(function (response) {
			if (!response.ok) {
				throw new Error('HTTP ' + response.status + ' на ' + part.url);
			}
			if (!response.body || !response.body.getReader) {
				return response.arrayBuffer().then(function (buffer) {
					updatePart(key, index, part.bytes);
					return new Uint8Array(buffer);
				});
			}
			const reader = response.body.getReader();
			const chunks = [];
			let size = 0;
			function pump() {
				return reader.read().then(function (step) {
					if (step.done) {
						const out = new Uint8Array(size);
						let offset = 0;
						for (const chunk of chunks) {
							out.set(chunk, offset);
							offset += chunk.length;
						}
						updatePart(key, index, part.bytes);
						return out;
					}
					chunks.push(step.value);
					size += step.value.length;
					updatePart(key, index, Math.min(size, part.bytes));
					return pump();
				});
			}
			return pump();
		}).then(gunzipIfNeeded);
	}

	function download(key) {
		return Promise.all(FILES[key].parts.map(function (part, index) {
			return downloadPart(key, index);
		})).then(function (pieces) {
			if (pieces.length === 1) {
				return pieces[0];
			}
			let length = 0;
			for (const piece of pieces) {
				length += piece.length;
			}
			const out = new Uint8Array(length);
			let offset = 0;
			for (const piece of pieces) {
				out.set(piece, offset);
				offset += piece.length;
			}
			pieces.length = 0;
			return out;
		});
	}

	// Хост может сам отдать .gz с Content-Encoding: gzip — тогда байты уже распакованы.
	function gunzipIfNeeded(bytes) {
		if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) {
			return Promise.resolve(bytes);
		}
		if (typeof DecompressionStream === 'function') {
			const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
			return new Response(stream).arrayBuffer().then(function (buffer) {
				return new Uint8Array(buffer);
			});
		}
		if (window.pako) {
			return Promise.resolve(window.pako.inflate(bytes));
		}
		return Promise.reject(new Error('Браузер не умеет распаковывать gzip.'));
	}

	// Мост держит распакованные байты (~50 МБ) только до старта движка: после этого Godot уже
	// скопировал их к себе, и release() отпускает копии — на телефоне это заметная экономия памяти.
	function installFetchBridge(wasmBytes, pckBytes) {
		const nativeFetch = window.fetch.bind(window);
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : (input && input.url) || '';
			const path = url.split('?')[0].split('#')[0];
			if (/(^|\/)index\.wasm$/.test(path)) {
				return Promise.resolve(new Response(wasmBytes, { status: 200, headers: { 'Content-Type': 'application/wasm' } }));
			}
			if (/(^|\/)index\.pck$/.test(path)) {
				return Promise.resolve(new Response(pckBytes, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } }));
			}
			return nativeFetch(input, init);
		};
		return function release() {
			wasmBytes = null;
			pckBytes = null;
			window.fetch = nativeFetch;
		};
	}

	function start() {
		const problem = checkSupport();
		if (problem) {
			fail(problem, false, 'wasm');
			return;
		}
		renderProgress();
		Promise.all([download('wasm'), download('pck')]).then(function (parts) {
			statusEl.textContent = 'Запускаем движок…';
			target = 100;
			fill.style.width = '100%';
			pctEl.textContent = '100%';
			const release = installFetchBridge(parts[0], parts[1]);
			parts.length = 0;
			const engine = new Engine(GODOT_CONFIG);
			const watchdog = setTimeout(function () {
				fail('Движок не запустился за 40 секунд.', true, 'engine');
			}, 40000);
			return engine.startGame({}).then(function () {
				clearTimeout(watchdog);
				started = true;
				if (window.trkLoaded) { window.trkLoaded(); }
				release();
				if (failed) {
					return;
				}
				boot.classList.add('gone');
				setTimeout(function () {
					boot.remove();
				}, 400);
			});
		}).catch(function (err) {
			console.error(err);
			const text = err && err.message ? err.message : String(err);
			fail(text, true, navigator.onLine === false || /fetch|network|load|HTTP|timeout/i.test(text) ? 'net' : 'engine');
		});
	}

	window.addEventListener('unhandledrejection', function (event) {
		const reason = event.reason;
		const text = reason && reason.message ? reason.message : String(reason);
		if (/WebAssembly|wasm/i.test(text)) {
			fail(text, true, 'wasm');
		}
	});

	const CRASH_PATTERN = /Aborted|abort\(|out of memory|memory access out of bounds|unreachable|RuntimeError|Cannot enlarge/i;
	window.addEventListener('unhandledrejection', function (event) {
		const reason = event.reason;
		const text = reason && reason.message ? reason.message : String(reason);
		if (CRASH_PATTERN.test(text)) {
			crash(text);
		}
	});
	window.addEventListener('error', function (event) {
		const text = event.message || (event.error && event.error.message) || '';
		if (CRASH_PATTERN.test(text)) {
			crash(text);
		}
	});

	start();
}());
</script>
